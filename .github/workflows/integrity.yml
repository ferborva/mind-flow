name: Integrity

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history and review tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run the complete test contract
        run: npm test

      - name: Verify the retained Round 06 review receipt
        run: >-
          node meta/review-freeze/review-freeze.mjs verify
          --policy=round-06
          --manifest=meta/review-freeze/round-06.review-freeze.json

      - name: Verify the retained Round 7 review receipt
        run: >-
          node meta/review-freeze/review-freeze.mjs verify
          --policy=round-07
          --manifest=meta/review-freeze/round-07.review-freeze.json

      - name: Verify the retained Round 8 review receipt
        run: >-
          node meta/review-freeze/review-freeze.mjs verify
          --policy=round-08
          --manifest=meta/review-freeze/round-08.review-freeze.json

      - name: Verify the retained Round 8.1 repair receipt
        run: >-
          node meta/review-freeze/review-freeze.mjs verify
          --policy=round-08
          --manifest=meta/review-freeze/round-08.1.review-freeze.json

      - name: Verify the retained Round 9 review receipt
        run: >-
          node meta/review-freeze/review-freeze.mjs verify
          --policy=round-09
          --manifest=meta/review-freeze/round-09.review-freeze.json

      - name: Verify the retained Round 9 pre-steer receipt
        run: >-
          node meta/review-freeze/review-freeze.mjs verify
          --policy=round-09-initial
          --manifest=meta/review-freeze/round-09.pre-steer.review-freeze.json

      - name: Verify the retained Round 9.1 repair receipt
        run: >-
          node meta/review-freeze/review-freeze.mjs verify
          --policy=round-09.1
          --manifest=meta/review-freeze/round-09.1.review-freeze.json

      - name: Check the current Round 09 forecast error disclosure
        run: node forecasts/prospective-pilot/round-09-nero/check-error-disclosure.mjs

      - name: Reproduce the timing-contract migration
        run: node dashboard/tools/migrate-timing-contract.mjs --check

      - name: Rebuild the global Observatory
        run: >-
          node dashboard/tools/build.mjs
          dashboard/snapshots/2026-09-09.r1.json
          dashboard/web/index.html

      - name: Rebuild the Australia pilot
        run: >-
          node dashboard/tools/build-australia-pilot.mjs
          pilots/australia/data/nero-clerical-2026-08.r2.json
          pilots/australia/web/index.html

      - name: Reproduce the Round 4 transition checkpoint
        run: |
          node integration/transition-bundle/tools/build-round-04-core.mjs --check
          node dashboard/tools/build-round-04-executable-if-view.mjs --check
          node integration/transition-bundle/tools/build-round-04-complete-core.mjs --check
          node dashboard/observatory/build.mjs --check
          node experiments/observatory-comparison/fixtures/build-round-04-fixtures.mjs --check

      - name: Reproduce retained Round 8 measurements and artifact byte parity
        run: |
          node pilots/australia/tools/primary-care.mts --check
          node pilots/australia/tools/primary-care-basket.mts --check
          node pilots/australia/tools/positive-signals.mts --check
          node dashboard/tools/primary-care-panel.mts --check
          node meta/build-artifacts.mjs --check

      - name: Reproduce retained Round 9 country measurements
        run: |
          node signals/countries/tools/country-set.mts --check
          node signals/countries/tools/build-measurements.mjs --check
          node signals/countries/weather-criteria-build.mjs --check
          node signals/countries/capability-candidate.mts --check
          node signals/countries/tools/permission-candidate.mjs --check
          node signals/countries/tools/render-country-view.mjs --check

      - name: Reproduce retained Round 10 income indicators
        run: node signals/countries/tools/income-measurements.mts --check
      - name: Replay unissued Canadian forecast draft
        run: node forecasts/prospective-pilot/round-10-canada/draft.mts --check
      - name: Replay Canadian statistical predicate basis
        run: node forecasts/prospective-pilot/round-10-canada/build-basis.mts --check

      - name: Reject generated-artifact drift
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Retain reproduced research interfaces
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-interfaces
          if-no-files-found: error
          path: |
            dashboard/web/index.html
            pilots/australia/web/index.html
            dashboard/observatory/index.html
            dashboard/observatory/data.js
            dashboard/observatory/app.js
            dashboard/observatory/styles.css
            experiments/observatory-comparison/rendered/*.html
